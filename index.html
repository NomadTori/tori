<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>Domácí rozpočet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']},colors:{darkbg:'#090d16'}}}}</script>
<style>
body{background:#090d16;color:#f1f5f9;font-family:'Plus Jakarta Sans',sans-serif}
.glass-card{background:rgba(15,23,42,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07)}
.glass-card-accent{background:radial-gradient(100% 100% at 50% 0%,rgba(124,58,237,.15) 0%,rgba(15,23,42,.8) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(139,92,246,.25)}
.input-field{transition:all .2s ease-in-out}.input-field:focus{box-shadow:0 0 0 2px rgba(99,102,241,.25)}
.hide .inp{-webkit-text-security:disc}
option{background:#0f172a;color:#f1f5f9}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#090d16}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:sh .3s}
</style>
</head>
<body class="min-h-screen relative overflow-x-hidden antialiased">
<div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 -z-10 pointer-events-none"></div>
<div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[350px] bg-indigo-600/10 blur-[130px] rounded-full pointer-events-none -z-10"></div>
<div class="fixed bottom-10 right-10 w-[400px] h-[400px] bg-violet-600/10 blur-[150px] rounded-full pointer-events-none -z-10"></div>
<div id="lock"></div>
<div id="app" class="hidden"></div>
<script>
/* ===== PWA: manifest inline + ikona ===== */
const ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#090d16"/><rect x="96" y="150" width="320" height="230" rx="40" fill="url(#g)"/><path d="M96 200a40 40 0 0 1 40-40h210a30 30 0 0 1 30 30v10H136a40 40 0 0 0-40 40z" fill="#fff" opacity=".18"/><rect x="316" y="238" width="130" height="86" rx="30" fill="#090d16" opacity=".55"/><circle cx="350" cy="281" r="14" fill="#fff"/></svg>';
const ICON_URI='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ICON);
(function(){try{const m={name:'Domácí rozpočet',short_name:'Rozpočet',display:'standalone',background_color:'#090d16',theme_color:'#090d16',start_url:location.href.split('#')[0],icons:[{src:ICON_URI,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
const f=document.createElement('link');f.rel='icon';f.href=ICON_URI;document.head.appendChild(f);
const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ICON_URI;document.head.appendChild(a);
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})();

/* ===== util ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dim=(y,m)=>new Date(y,m,0).getDate();
const shiftC=(id,n)=>{let[y,m]=id.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const cyc=(id,pd)=>{const[y,m]=id.split('-').map(Number);const s=new Date(y,m-1,Math.min(pd,dim(y,m)));const n=new Date(y,m,Math.min(pd,dim(y,m+1)));return{s,e:new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)}};
const dateCyc=(ds,pd)=>{const d=new Date(ds+'T00:00'),y=d.getFullYear(),m=d.getMonth()+1,id=y+'-'+pad(m);return d.getDate()<Math.min(pd,dim(y,m))?shiftC(id,-1):id};
const fd=d=>d.getDate()+'. '+(d.getMonth()+1)+'. ';
const k=x=>x*100;
const parse=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN};
const sm=(a,f)=>a.reduce((s,x)=>s+f(x),0);

/* ===== šifrování (PBKDF2 + AES-256-CBC, CryptoJS) ===== */
let KEY=null,SALT=null;
function derive(pin,salt){SALT=salt;KEY=CryptoJS.PBKDF2(pin,CryptoJS.enc.Hex.parse(salt),{keySize:8,iterations:20000,hasher:CryptoJS.algo.SHA256})}
function enc(){const iv=CryptoJS.lib.WordArray.random(16);const ct=CryptoJS.AES.encrypt('HBC1'+JSON.stringify(S),KEY,{iv,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7});return{v:1,ts:S.ts,salt:SALT,iv:iv.toString(),ct:ct.toString()}}
function dec(pl,pin){try{derive(pin,pl.salt);const p=CryptoJS.AES.decrypt(pl.ct,KEY,{iv:CryptoJS.enc.Hex.parse(pl.iv),mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7}).toString(CryptoJS.enc.Utf8);return p.startsWith('HBC1')?JSON.parse(p.slice(4)):null}catch(e){return null}}

/* ===== cloud (JSONbin.io) ===== */
const BIN='6ada4facffd5d160538370e0',MK='$2a$10$HNwlTQdlnpAIusjXvv3LG.URQSchoF./4J5It5om4TpB5OJZux.1m',BURL='https://api.jsonbin.io/v3/b/'+BIN;
async function cget(){const r=await fetch(BURL+'/latest',{headers:{'X-Master-Key':MK,'X-Bin-Meta':'false'}});if(!r.ok)throw 0;return r.json()}
async function cput(o){const r=await fetch(BURL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MK},body:JSON.stringify(o)});if(!r.ok)throw 0}
let st='off',tm;
function dirty(){S.ts=Date.now();try{localStorage.setItem('hbc:enc',JSON.stringify(enc()))}catch(e){}st='busy';hdrStatus();clearTimeout(tm);tm=setTimeout(push,800)}
async function push(){try{await cput(JSON.parse(localStorage.getItem('hbc:enc')));st='ok'}catch(e){st='off'}hdrStatus()}
async function refresh(){st='busy';hdrStatus();try{const c=await cget();if(c&&c.ct&&c.ts>S.ts){const n=dec(c,PIN);if(n){S=n;localStorage.setItem('hbc:enc',JSON.stringify(c))}}else if(c.ts<S.ts){await push();return}st='ok'}catch(e){st='off'}render()}
addEventListener('online',()=>S&&push());addEventListener('offline',()=>{st='off';S&&hdrStatus()});

/* ===== data model ===== */
function def(){return{inc:{a:k(45000),b:k(40000)},shared:[{id:uid(),label:'Nájem',amount:k(20000),pa:5000},{id:uid(),label:'Elektřina',amount:k(3000),pa:6000},{id:uid(),label:'Internet',amount:k(600),pa:0}],indiv:[{id:uid(),pid:'a',label:'Netflix',amount:k(379)},{id:uid(),pid:'a',label:'Gym',amount:k(800)},{id:uid(),pid:'a',label:'Mobil',amount:k(299)},{id:uid(),pid:'b',label:'Spotify',amount:k(269)},{id:uid(),pid:'b',label:'Životní pojištění',amount:k(1200)}],sav:{a:k(5000),b:k(5000)},env:[{id:uid(),name:'Jídlo a drogerie',limit:k(5000),owner:'a'},{id:uid(),name:'Zábava',limit:k(3000),owner:'a'},{id:uid(),name:'Jídlo a drogerie',limit:k(5000),owner:'b'},{id:uid(),name:'Palivo',limit:k(4000),owner:'b'},{id:uid(),name:'Zábava',limit:k(3000),owner:'b'}],tr:[],tx:[]}}
function init(){const pd=11,id=dateCyc(iso(new Date()),pd);return{profiles:[{id:'a',name:'Tori'},{id:'b',name:'Fifi'}],payday:pd,hide:false,active:id,budgets:{[id]:def()},last:{env:null,payer:'a'},ts:Date.now()}}
let S=null,PIN='',U={tab:'plan'},TO=null;
const P=['a','b'];
const B=()=>{let b=S.budgets[S.active];if(!b){const ks=Object.keys(S.budgets).sort(),src=S.budgets[ks.filter(x=>x<S.active).pop()||ks[0]];b=src?{...JSON.parse(JSON.stringify(src)),tx:[],tr:[]}:def();S.budgets[S.active]=b}return b};
const nm=p=>esc(p==='joint'?'Společný účet':S.profiles[p==='a'?0:1].name);
const fmt=v=>S.hide?'*** Kč':(v/100).toLocaleString('cs-CZ',{maximumFractionDigits:2})+'\u00a0Kč';
const num=v=>String(v/100).replace('.',',');
const split=(t,pa)=>({a:Math.floor(t*pa/10000),b:t-Math.floor(t*pa/10000)});
function es(b,e){const eff=e.limit+sm(b.tr.filter(t=>t.to===e.id),t=>t.amount)-sm(b.tr.filter(t=>t.from===e.id),t=>t.amount),sp=sm(b.tx.filter(t=>t.env===e.id),t=>t.amount),rem=eff-sp,pct=eff>0?sp/eff*100:sp>0?999:0;return{eff,sp,rem,pct,lv:pct>100?'over':pct>=85?'high':pct>=60?'warn':'ok'}}
function ps(b,p){const sh=sm(b.shared,e=>split(e.amount,e.pa)[p]),ind=sm(b.indiv.filter(e=>e.pid===p),e=>e.amount),inc=b.inc[p]||0,sv=b.sav[p]||0,mine=b.env.filter(e=>e.owner===p),al=sm(mine,e=>es(b,e).eff),st=inc-sh-ind-sv-al,ov=sm(mine,e=>Math.max(0,-es(b,e).rem)),off=sm(b.tx.filter(t=>!t.env),t=>t.payer==='joint'?split(t.amount,5000)[p]:t.payer===p?t.amount:0);return{inc,sh,ind,sv,al,st,ov,off,fix:sh+ind,pk:st-ov-off}}

/* ===== UI helpers ===== */
const LV={ok:['emerald','text-emerald-400','bg-emerald-500'],warn:['amber','text-amber-300','bg-amber-400'],high:['orange','text-orange-400','bg-orange-500'],over:['red','text-red-400','bg-red-500']};
const sec=(col,ic,t,sub,body)=>`<section class="glass-card rounded-2xl p-5 sm:p-6 shadow-xl relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-${col}-500"></div><div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-${col}-500/10 border border-${col}-500/20 flex items-center justify-center text-${col}-400"><i class="fa-solid ${ic} text-lg"></i></div><div><h2 class="text-lg font-bold text-white">${t}</h2><p class="text-xs text-slate-400">${sub}</p></div></div>${body}</section>`;
const inp=(f,v,t,col,cls='')=>`<div class="relative ${cls}"><input data-f="${f}" data-t="${t}" value="${t==='text'?esc(v):t==='pct'?v/100:t==='int'?v:num(v)}" ${t==='text'?'maxlength="60"':'inputmode="decimal"'} class="inp input-field w-full bg-slate-950/80 border border-slate-800 text-slate-100 ${t==='text'?'font-medium pr-3':'font-bold pr-10'} rounded-xl pl-3.5 py-2.5 text-sm focus:border-${col}-500 focus:outline-none">${t==='text'?'':`<span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-500">${t==='pct'?'%':t==='int'?'.':'Kč'}</span>`}</div>`;
const del=(kk,i)=>`<button data-act="del" data-k="${kk}" data-i="${i}" class="p-2 text-slate-600 hover:text-rose-400 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>`;
const addB=(kk,p,col,txt)=>`<button data-act="add" data-k="${kk}" data-p="${p||''}" class="mt-3 text-xs font-semibold text-${col}-400 bg-${col}-500/10 hover:bg-${col}-500/20 border border-${col}-500/30 px-3 py-1.5 rounded-xl transition active:scale-95"><i class="fa-solid fa-plus mr-1"></i>${txt}</button>`;
const pcol=p=>p==='a'?'violet':'sky';

function hhInner(b){const T=P.map(p=>ps(b,p)),inc=sm(T,x=>x.inc),fix=sm(T,x=>x.fix),al=sm(T,x=>x.al),sv=sm(T,x=>x.sv),pk=sm(T,x=>x.pk),i=inc>0?inc:1,w=x=>Math.min(100,Math.max(0,x/i*100));
return`<div class="flex justify-between items-baseline"><span class="text-sm font-bold text-slate-200"><i class="fa-solid fa-house-user text-emerald-400 mr-1.5"></i>Celá domácnost dohromady</span><span class="text-xs text-violet-300">${S.hide?'':Math.round((fix+al+sv)/i*100)+' % alokováno'}</span></div><div class="text-xs text-slate-400 mt-1">Volné kapesné celkem</div><div class="text-4xl font-black tracking-tight ${pk<0?'text-rose-400':'text-white'}">${fmt(pk)}</div><div class="w-full h-3.5 bg-slate-950/80 rounded-full overflow-hidden flex p-0.5 border border-slate-800 mt-3"><div class="h-full bg-rose-500 rounded-l-full transition-all duration-300" style="width:${w(fix)}%"></div><div class="h-full bg-amber-500 transition-all duration-300" style="width:${w(al)}%"></div><div class="h-full bg-cyan-400 transition-all duration-300" style="width:${w(sv)}%"></div><div class="h-full bg-violet-500 rounded-r-full transition-all duration-300" style="width:${w(Math.max(0,pk))}%"></div></div><div class="grid grid-cols-2 gap-1.5 mt-2.5 text-[11px] text-slate-400"><span><i class="fa-solid fa-circle text-emerald-500 text-[7px] mr-1"></i>Příjmy <b class="text-emerald-400">${fmt(inc)}</b></span><span><i class="fa-solid fa-circle text-rose-500 text-[7px] mr-1"></i>Fixní výdaje <b class="text-slate-200">${fmt(fix)}</b></span><span><i class="fa-solid fa-circle text-amber-500 text-[7px] mr-1"></i>Obálky <b class="text-slate-200">${fmt(al)}</b></span><span><i class="fa-solid fa-circle text-cyan-400 text-[7px] mr-1"></i>Úspory <b class="text-slate-200">${fmt(sv)}</b></span></div>`}
function sumHtml(){const b=B();let bad=false;const blocks=P.map(p=>{const s=ps(b,p),inc=s.inc>0?s.inc:1,w=x=>Math.min(100,Math.max(0,x/inc*100)),pk=Math.max(0,s.st);if(s.pk<0)bad=true;const al=Math.round((s.fix+s.al+s.sv)/inc*100);
return`<div class="mt-5"><div class="flex justify-between items-baseline"><span class="text-sm font-bold text-slate-200"><span class="inline-block w-2 h-2 rounded-full bg-${pcol(p)}-400 mr-1.5"></span>${nm(p)}</span><span class="text-xs text-violet-300">${S.hide?'':al+' % alokováno'}</span></div><div class="text-xs text-slate-400 mt-1">Volné kapesné</div><div class="text-4xl font-black tracking-tight ${s.pk<0?'text-rose-400':'text-white'}">${fmt(s.pk)}</div><div class="w-full h-3.5 bg-slate-950/80 rounded-full overflow-hidden flex p-0.5 border border-slate-800 mt-3"><div class="h-full bg-rose-500 rounded-l-full transition-all duration-300" style="width:${w(s.fix)}%"></div><div class="h-full bg-amber-500 transition-all duration-300" style="width:${w(s.al)}%"></div><div class="h-full bg-cyan-400 transition-all duration-300" style="width:${w(s.sv)}%"></div><div class="h-full bg-violet-500 rounded-r-full transition-all duration-300" style="width:${w(pk)}%"></div></div><div class="grid grid-cols-2 gap-1.5 mt-2.5 text-[11px] text-slate-400"><span><i class="fa-solid fa-circle text-rose-500 text-[7px] mr-1"></i>Fixní <b class="text-slate-200">${fmt(s.fix)}</b></span><span><i class="fa-solid fa-circle text-amber-500 text-[7px] mr-1"></i>Obálky <b class="text-slate-200">${fmt(s.al)}</b></span><span><i class="fa-solid fa-circle text-cyan-400 text-[7px] mr-1"></i>Úspory <b class="text-slate-200">${fmt(s.sv)}</b></span><span><i class="fa-solid fa-circle text-violet-500 text-[7px] mr-1"></i>Příjem <b class="text-emerald-400">${fmt(s.inc)}</b></span></div></div>`}).join('<div class="border-t border-violet-500/20 mt-5"></div>');
return`<div class="glass-card-accent rounded-3xl p-6 shadow-2xl"><div class="flex items-center justify-between"><span class="text-xs font-bold uppercase tracking-wider text-violet-300/80">Výsledek plánovače</span><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${bad?'bg-rose-500/20 text-rose-300 border-rose-500/30':'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'} border flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${bad?'bg-rose-500 animate-ping':'bg-emerald-400 animate-pulse'}"></span>${bad?'Mínusový rozpočet':'Vyrovnané'}</span></div>${blocks}<div class="mt-5 pt-5 border-t border-violet-500/30">${hhInner(b)}</div></div>`}
function updateSum(){const h=sumHtml();const d=$('#sumD');if(d)d.innerHTML=h}

function planner(b){
const inc=sec('emerald','fa-wallet','Měsíční příjmy','Čistá výplata každého z vás',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${P.map(p=>`<div><label class="block text-xs font-medium text-slate-300 mb-1.5">${nm(p)}</label>${inp('inc.'+p,b.inc[p]||0,'num','emerald')}</div>`).join('')}</div>`);
const shared=sec('rose','fa-house','Společné fixní výdaje','Nájem, energie, internet. Podíl prvního profilu v %',`<div class="space-y-2">${b.shared.map((e,i)=>`<div class="row flex flex-wrap items-center gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80"><div class="flex-1 min-w-[140px]">${inp(`shared.${i}.label`,e.label,'text','rose')}</div>${inp(`shared.${i}.amount`,e.amount,'num','rose','w-36')}${inp(`shared.${i}.pa`,e.pa,'pct','rose','w-24')}<span class="rest text-xs text-slate-400 w-20">${nm('b')} ${(10000-e.pa)/100} %</span>${del('shared',i)}</div>`).join('')}</div>${addB('shared','','rose','Přidat položku')}`);
const indiv=`<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${P.map(p=>{const rows=b.indiv.map((e,i)=>[e,i]).filter(([e])=>e.pid===p);return`<div class="glass-card rounded-2xl p-5 relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-rose-500"></div><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-white"><i class="fa-solid fa-user text-${pcol(p)}-400 mr-2"></i>${nm(p)}</h3><span class="text-xs font-semibold text-rose-400">${fmt(ps(b,p).ind)}</span></div><div class="space-y-2">${rows.map(([e,i])=>`<div class="flex items-center gap-2"><div class="flex-1 min-w-0">${inp(`indiv.${i}.label`,e.label,'text','rose')}</div>${inp(`indiv.${i}.amount`,e.amount,'num','rose','w-32')}${del('indiv',i)}</div>`).join('')}</div>${addB('indiv',p,'rose','+ Řádek')}</div>`}).join('')}</div>`;
const env=`<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${P.map(p=>{const rows=b.env.map((e,i)=>[e,i]).filter(([e])=>e.owner===p);return`<div class="glass-card rounded-2xl p-5 relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-white"><i class="fa-solid fa-box-archive text-amber-400 mr-2"></i>${nm(p)}</h3><span class="text-xs font-semibold text-amber-400">${fmt(sm(rows,([e])=>e.limit))}</span></div><div class="space-y-2">${rows.map(([e,i])=>`<div class="flex items-center gap-2"><div class="flex-1 min-w-0">${inp(`env.${i}.name`,e.name,'text','amber')}</div>${inp(`env.${i}.limit`,e.limit,'num','amber','w-32')}${del('env',i)}</div>`).join('')}</div>${addB('env',p,'amber','+ Obálka')}</div>`}).join('')}</div>`;
const sav=sec('cyan','fa-piggy-bank','Odklad na úspory','Zaplať nejprve sám sobě (v den výplaty)',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${P.map(p=>`<div><label class="block text-xs font-medium text-slate-300 mb-1.5">${nm(p)}</label>${inp('sav.'+p,b.sav[p]||0,'num','cyan')}</div>`).join('')}</div>`);
const hd=(c,t)=>`<h2 class="text-sm font-bold uppercase tracking-wider text-${c}-400 mb-3 mt-2">${t}</h2>`;
return`<div class="space-y-6">${inc}${shared}<div>${hd('rose','Osobní fixní výdaje')}${indiv}</div><div>${hd('amber','Obálky (limity)')}${env}</div>${sav}</div>`}

function envT(b,e,own){const s=es(b,e),[c,tx,bg]=LV[s.lv];return`<div class="p-3.5 bg-slate-950/50 border ${s.lv==='over'?'border-red-500/40 bg-red-500/5':'border-slate-800/80'} rounded-xl"><div class="flex justify-between text-sm"><span class="font-semibold text-slate-200"><i class="fa-solid fa-box-archive text-amber-400 mr-1.5 text-xs"></i>${esc(e.name)}${own?` <span class="text-xs text-slate-500">· ${nm(e.owner)}</span>`:''}</span><span class="font-bold ${tx}">${s.lv==='over'?'⚠ ':''}${fmt(s.rem)}</span></div><div class="h-2 bg-slate-900 rounded-full overflow-hidden my-2"><div class="h-full ${bg} transition-all duration-500" style="width:${Math.min(100,s.pct)}%"></div></div><div class="text-[11px] text-slate-500">utraceno ${fmt(s.sp)} z ${fmt(s.eff)} · ${Math.min(999,Math.round(s.pct))} %</div></div>`}
function over(b){return`<div class="glass-card-accent rounded-3xl p-6 mb-4">${hhInner(b)}</div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${P.map(p=>{const s=ps(b,p),pc=s.st>0?s.pk/s.st*100:0,col=s.pk<0?'text-rose-400':pc>50?'text-emerald-400':pc>=20?'text-amber-300':'text-orange-400';return`<div class="glass-card-accent rounded-3xl p-6"><div class="text-sm font-bold text-slate-200 mb-1"><span class="inline-block w-2 h-2 rounded-full bg-${pcol(p)}-400 mr-1.5"></span>${nm(p)}</div><div class="text-xs text-slate-400">Zbývající kapesné</div><div class="text-4xl font-black ${col}">${fmt(s.pk)}</div><div class="h-2.5 bg-slate-950/80 rounded-full overflow-hidden my-3 border border-slate-800"><div class="h-full bg-violet-500 transition-all duration-500" style="width:${Math.max(0,Math.min(100,pc))}%"></div></div><div class="text-[11px] text-slate-500 mb-4">z výchozích ${fmt(s.st)}${s.ov||s.off?` · přetečení −${fmt(s.ov)}, mimo obálky −${fmt(s.off)}`:''}</div><div class="space-y-2.5">${b.env.filter(e=>e.owner===p).map(e=>envT(b,e)).join('')||'<div class="text-xs text-slate-500">Žádné obálky</div>'}</div></div>`}).join('')}</div>`}

function txs(b){const sel=(id,sx='')=>`<select id="${id}" class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-violet-500">${sx}</select>`;
const eo=b.env.map(e=>`<option value="${e.id}" ${S.last.env===e.id?'selected':''}>${esc(e.name)} · ${nm(e.owner)}</option>`).join('')+`<option value="" ${S.last.env===''?'selected':''}>Mimo obálky</option>`;
const po=['a','b'].map(p=>`<option value="${p}" ${S.last.payer===p?'selected':''}>${nm(p)}</option>`).join('');
const l=[...b.tx].sort((x,y)=>y.date.localeCompare(x.date)||y.at-x.at);
return`<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start"><div class="space-y-6">${sec('violet','fa-plus','Nový nákup','Rychlé zadání výdaje',`<form id="ef" class="space-y-3"><input id="amt" inputmode="decimal" placeholder="Částka" autocomplete="off" class="inp w-full bg-slate-950/80 border border-slate-800 text-white font-black text-2xl rounded-xl px-3.5 py-3 focus:border-violet-500 focus:outline-none"><input id="ttl" maxlength="60" placeholder="Popis (volitelné)" class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 rounded-xl px-3.5 py-2.5 text-sm focus:border-violet-500 focus:outline-none">${sel('eenv',eo)}${sel('epay',po)}<input id="edt" type="date" value="${iso(new Date())}" class="w-full bg-slate-950/80 border border-slate-800 text-slate-100 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none"><button class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold rounded-xl py-3 transition active:scale-95"><i class="fa-solid fa-plus mr-1.5"></i>Uložit nákup</button></form>`)}</div>${sec('cyan','fa-receipt','Nákupy v cyklu','Poslední nahoře',`<div class="space-y-2">${l.map(t=>{const e=b.env.find(x=>x.id===t.env);return`<div class="flex items-center justify-between gap-2 p-2.5 bg-slate-950/60 border border-slate-800/80 rounded-xl text-sm"><div class="min-w-0"><div class="font-semibold text-slate-200 truncate"><span class="inline-block w-2 h-2 rounded-full mr-1.5 ${t.payer==='a'?'bg-violet-400':t.payer==='b'?'bg-sky-400':'bg-slate-500'}"></span>${esc(t.title)}</div><div class="text-[11px] text-slate-500">${t.date} · ${e?esc(e.name):'Mimo obálky'} · ${nm(t.payer)}</div></div><div class="shrink-0 font-bold text-slate-100">${fmt(t.amount)}<button data-act="deltx" data-id="${t.id}" class="ml-2 text-slate-600 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button></div></div>`}).join('')||'<div class="text-xs text-slate-500">Zatím žádné nákupy.</div>'}</div>`)}</div>`}

function sett(){return sec('violet','fa-gear','Nastavení','Jména se okamžitě propíšou všude',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${S.profiles.map((p,i)=>`<div><label class="block text-xs text-slate-300 mb-1.5">Profil ${i+1}</label>${inp(`profiles.${i}.name`,p.name,'text','violet')}</div>`).join('')}<div><label class="block text-xs text-slate-300 mb-1.5">Den výplaty (1–31)</label>${inp('payday',S.payday,'int','violet')}</div></div><div class="flex flex-wrap gap-2 mt-5"><button data-act="lockNow" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold"><i class="fa-solid fa-lock mr-1.5"></i>Zamknout</button><button data-act="reset" class="px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-semibold">Smazat všechna data</button></div><p class="text-xs text-slate-500 mt-4">Data jsou šifrovaná PINem v tomto zařízení i na JSONbin.io.</p>`)}

const STL={ok:['🟢','Synced','text-emerald-400'],busy:['🟡','Ukládám','text-amber-300'],off:['🔴','Offline','text-rose-400']};
function hdrStatus(){const e=$('#stat');if(!e)return;const[i,t,c]=STL[st];e.className='text-xs font-semibold flex items-center gap-1.5 '+c;e.innerHTML=`${i} ${t}`}
const MN=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
function cyOpts(){const set=new Set(Object.keys(S.budgets)),base=dateCyc(iso(new Date()),S.payday);for(let i=-12;i<=12;i++)set.add(shiftC(base,i));set.add(S.active);return [...set].sort().map(id=>{const[y,m]=id.split('-').map(Number);return`<option value="${id}" ${id===S.active?'selected':''}>${MN[m-1]} ${y}</option>`}).join('')}
function render(){if(!S)return;const b=B(),c=cyc(S.active,S.payday),tabs=[['plan','Plánovač','fa-sliders'],['over','Přehled','fa-chart-pie'],['tx','Nákupy','fa-receipt'],['set','Nastavení','fa-gear']];
const A=$('#app');A.className=S.hide?'hide':'';
A.innerHTML=`<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8 pb-16"><header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-800/80"><div><div class="flex flex-wrap items-center gap-2 mb-1"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-violet-500/10 text-violet-400 border border-violet-500/20"><i class="fa-solid fa-user-group mr-1"></i>${nm('a')} &amp; ${nm('b')}</span><span class="px-2.5 py-0.5 rounded-full bg-slate-900/80 border border-slate-800"><span id="stat"></span></span><button data-act="sync" title="Obnovit z cloudu" class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 border border-slate-800 hover:bg-slate-800">🔄</button><button data-act="hide" title="Skrýt částky" class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 border border-slate-800 hover:bg-slate-800"><i class="fa-solid ${S.hide?'fa-eye-slash':'fa-eye'}"></i></button><button data-act="lockNow" title="Zamknout" class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 border border-slate-800 hover:bg-slate-800"><i class="fa-solid fa-lock"></i></button></div><h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Domácí rozpočet</h1></div><div class="flex items-center bg-slate-900/90 border border-slate-800 rounded-2xl p-1.5 shadow-lg self-start md:self-auto"><button data-act="cy" data-n="-1" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"><i class="fa-solid fa-chevron-left text-xs"></i></button><div class="px-2 py-0.5 text-center min-w-[170px]"><select data-cysel aria-label="Měsíční cyklus" class="bg-slate-950 text-slate-100 font-bold text-sm rounded-lg px-2 py-1 border border-slate-700 focus:outline-none focus:border-violet-500 cursor-pointer max-w-[190px]">${cyOpts()}</select><span class="block text-[10px] text-slate-500 mt-0.5">${fd(c.s)}– ${fd(c.e)}${c.e.getFullYear()}</span></div><button data-act="cy" data-n="1" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"><i class="fa-solid fa-chevron-right text-xs"></i></button></div></header><div class="flex gap-2 overflow-x-auto mb-6">${tabs.map(([i,l,ic])=>`<button data-act="tab" data-v="${i}" class="shrink-0 px-4 py-2 rounded-xl text-sm font-semibold border transition ${U.tab===i?'bg-violet-500/20 text-violet-300 border-violet-500/40':'bg-slate-900/60 text-slate-400 border-slate-800 hover:text-white'}"><i class="fa-solid ${ic} mr-1.5"></i>${l}</button>`).join('')}</div>${U.tab==='plan'?`<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start"><div class="lg:col-span-7 order-2 lg:order-1">${planner(b)}</div><div id="sumD" class="lg:col-span-5 lg:sticky lg:top-8 order-1 lg:order-2 sticky top-2 z-20 lg:z-auto">${sumHtml()}</div></div>`:U.tab==='over'?over(b):U.tab==='tx'?txs(b):sett()}</div>${TO?`<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-100 text-slate-900 px-4 py-2.5 rounded-xl text-sm font-semibold z-50">${esc(TO)}</div>`:''}`;hdrStatus()}
function say(m){TO=m;render();clearTimeout(say.t);say.t=setTimeout(()=>{TO=null;render()},3000)}

/* ===== události ===== */
function setPath(path,val){const p=path.split('.');let o=(p[0]==='profiles'||p[0]==='payday')?S:B();for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.f||!S)return;const t=el.dataset.t;let v=el.value;if(t==='num')v=Math.round(Math.max(0,parse(v)||0)*100);else if(t==='pct'){v=Math.round(Math.max(0,Math.min(100,parse(v)||0))*100);const r=el.closest('.row');if(r)r.querySelector('.rest').textContent=nm('b').replace(/&amp;/g,'&')+' '+(10000-v)/100+' %'}else if(t==='int')v=Math.max(1,Math.min(31,parseInt(v)||11));else v=v.slice(0,60);setPath(el.dataset.f,v);updateSum();dirty()});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&(f.startsWith('profiles')||f==='payday'))render()});
document.addEventListener('change',e=>{if(S&&e.target.dataset&&e.target.dataset.cysel!==undefined){S.active=e.target.value;dirty();render()}});
document.addEventListener('submit',e=>{e.preventDefault();const b=B();
if(e.target.id==='ef'){const a=parse($('#amt').value),d=$('#edt').value;if(!(a>0)||a>1e7)return say('Zadej platnou částku');if(dateCyc(d,S.payday)!==S.active)return say('Datum je mimo zobrazený cyklus');const ev=$('#eenv').value||null,en=b.env.find(x=>x.id===ev),pay=$('#epay').value,t={id:uid(),amount:Math.round(a*100),title:($('#ttl').value.trim()||(en?en.name:'Nákup')).slice(0,60),env:ev,payer:pay,date:d,at:Date.now()};b.tx.push(t);S.last={env:ev===null?'':ev,payer:pay};dirty();say('Uloženo: '+t.title)}
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!S)return;const a=el.dataset.act,d=el.dataset,b=B();
if(a==='tab'){U.tab=d.v;render()}
else if(a==='cy'){S.active=shiftC(S.active,+d.n);dirty();render()}
else if(a==='hide'){S.hide=!S.hide;dirty();render()}
else if(a==='sync')refresh();
else if(a==='lockNow')lockApp();
else if(a==='add'){const kk=d.k;if(kk==='shared')b.shared.push({id:uid(),label:'Nová položka',amount:0,pa:5000});if(kk==='indiv')b.indiv.push({id:uid(),pid:d.p,label:'Nová položka',amount:0});if(kk==='env')b.env.push({id:uid(),name:'Nová obálka',limit:0,owner:d.p});dirty();render()}
else if(a==='del'){b[d.k].splice(+d.i,1);dirty();render()}
else if(a==='deltx'){b.tx=b.tx.filter(x=>x.id!==d.id);dirty();render()}
else if(a==='reset'){if(confirm('Opravdu smazat všechna data (i v cloudu)?')){S=init();dirty();render()}}});

/* ===== zámek / PIN ===== */
let mode='unlock',pin='',first=null,loc=null,cl=null,busy=false;
function lockHtml(msg,err){const dots=[0,1,2,3].map(i=>`<span class="w-3.5 h-3.5 rounded-full border ${i<pin.length?'bg-violet-400 border-violet-400':'border-slate-600'}"></span>`).join('');
const title=mode==='setup'?(first?'Potvrď PIN':'Vytvoř 4místný PIN'):mode==='err'?'Nelze načíst cloud':'Zadej PIN';
const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(x=>x===''?'<span></span>':`<button data-pk="${x}" class="h-14 rounded-2xl bg-slate-900/80 border border-slate-800 hover:bg-slate-800 active:scale-95 transition text-xl font-bold">${x}</button>`).join('');
return`<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#090d16]/80 backdrop-blur-md"><div id="lbox" class="glass-card-accent rounded-3xl p-7 w-full max-w-xs text-center ${err?'shake':''}"><div class="w-16 h-16 mx-auto mb-3 rounded-2xl overflow-hidden"><img src="${ICON_URI}" alt="" class="w-full h-full"></div><h2 class="text-xl font-extrabold text-white">${title}</h2><p class="text-xs ${err?'text-rose-400':'text-slate-400'} mt-1 min-h-[16px]">${msg||'Domácí rozpočet je zašifrovaný'}</p>${mode==='err'?'<button data-pk="retry" class="mt-5 w-full bg-violet-600 text-white font-bold rounded-xl py-3">Zkusit znovu</button>':`<div class="flex justify-center gap-3 my-5">${dots}</div><div class="grid grid-cols-3 gap-2.5">${keys}</div>`}</div></div>`}
function showLock(msg,err){pin='';$('#lock').innerHTML=lockHtml(msg,err)}
async function boot(){loc=localStorage.getItem('hbc:enc');if(loc){mode='unlock';return showLock()}$('#lock').innerHTML=lockHtml('Načítám cloud…');try{cl=await cget();mode=cl&&cl.ct?'unlock':'setup'}catch(e){mode='err';st='off';return showLock('Jsi offline a v zařízení nejsou žádná data.')}showLock()}
function pk(x){if(busy)return;if(x==='retry')return boot();if(x==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=x;$('#lock').innerHTML=lockHtml();if(pin.length===4){busy=true;setTimeout(submitPin,60)}}
async function submitPin(){const p=pin;try{
if(mode==='setup'){if(!first){first=p;busy=false;return showLock('Zadej PIN ještě jednou')}if(p!==first){first=null;busy=false;return showLock('PINy se neshodují',true)}derive(p,CryptoJS.lib.WordArray.random(16).toString());PIN=p;S=init();first=null;return open()}
let L=null,C=null;if(loc)L=dec(JSON.parse(loc),p);try{cl=cl||await cget();if(cl&&cl.ct)C=dec(cl,p);st='ok'}catch(e){st='off'}
if(!L&&!C){busy=false;return showLock('Špatný PIN',true)}
S=(L&&C)?(C.ts>L.ts?C:L):(L||C);PIN=p;
if(L&&(!C||L.ts>C.ts)&&st==='ok'){const pl=enc();localStorage.setItem('hbc:enc',JSON.stringify(pl));push()}else if(C&&(!L||C.ts>=L.ts))localStorage.setItem('hbc:enc',JSON.stringify(cl));
open()}catch(e){busy=false;showLock('Chyba, zkus znovu',true)}}
function open(){busy=false;if(S.last&&S.last.payer==='joint')S.last.payer='a';$('#lock').innerHTML='';$('#app').classList.remove('hidden');dirty();render()}
function lockApp(){S=null;KEY=null;PIN='';cl=null;loc=localStorage.getItem('hbc:enc');$('#app').innerHTML='';mode='unlock';showLock()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pk]');if(b)pk(b.dataset.pk)});
document.addEventListener('keydown',e=>{if(!S&&$('#lbox')){if(/^\d$/.test(e.key))pk(e.key);else if(e.key==='Backspace')pk('⌫')}});
boot();
</script>
</body>
</html>
