<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','sans-serif']},colors:{darkbg:'#090d16'}}}}</script>
<style>
body{background:#090d16;color:#f1f5f9;font-family:'Plus Jakarta Sans',sans-serif}
.glass-card{background:rgba(15,23,42,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07)}
.glass-card-accent{background:radial-gradient(100% 100% at 50% 0%,rgba(124,58,237,.15) 0%,rgba(15,23,42,.8) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(139,92,246,.25)}
.input-field{transition:all .2s ease-in-out}.input-field:focus{box-shadow:0 0 0 2px rgba(99,102,241,.25)}
.hide .inp{-webkit-text-security:disc}
option{background:#0f172a;color:#f1f5f9}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#090d16}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:sh .3s}
</style>
</head>
<body class="min-h-screen relative overflow-x-hidden antialiased">
<div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 -z-10 pointer-events-none"></div>
<div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[350px] bg-indigo-600/10 blur-[130px] rounded-full pointer-events-none -z-10"></div>
<div class="fixed bottom-10 right-10 w-[400px] h-[400px] bg-violet-600/10 blur-[150px] rounded-full pointer-events-none -z-10"></div>
<div id="lock"></div>
<div id="app" class="hidden"></div>
<script>
/* ===== PWA: manifest inline + ikona ===== */
const ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#090d16"/><rect x="96" y="150" width="320" height="230" rx="40" fill="url(#g)"/><path d="M96 200a40 40 0 0 1 40-40h210a30 30 0 0 1 30 30v10H136a40 40 0 0 0-40 40z" fill="#fff" opacity=".18"/><rect x="316" y="238" width="130" height="86" rx="30" fill="#090d16" opacity=".55"/><circle cx="350" cy="281" r="14" fill="#fff"/></svg>';
const ICON_URI='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ICON);
(function(){try{const m={name:'Domácí rozpočet',short_name:'Rozpočet',display:'standalone',background_color:'#090d16',theme_color:'#090d16',start_url:location.href.split('#')[0],icons:[{src:ICON_URI,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
const f=document.createElement('link');f.rel='icon';f.href=ICON_URI;document.head.appendChild(f);
const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ICON_URI;document.head.appendChild(a);
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})();

/* ===== util ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dim=(y,m)=>new Date(y,m,0).getDate();
const shiftC=(id,n)=>{let[y,m]=id.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const cyc=(id,pd)=>{const[y,m]=id.split('-').map(Number);const s=new Date(y,m-1,Math.min(pd,dim(y,m)));const n=new Date(y,m,Math.min(pd,dim(y,m+1)));return{s,e:new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)}};
const dateCyc=(ds,pd)=>{const d=new Date(ds+'T00:00'),y=d.getFullYear(),m=d.getMonth()+1,id=y+'-'+pad(m);return d.getDate()<Math.min(pd,dim(y,m))?shiftC(id,-1):id};
const fd=d=>d.getDate()+'. '+(d.getMonth()+1)+'. ';
const k=x=>x*100;
const parse=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN};
const sm=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const MN=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
const cyLabel=id=>{const[y,m]=id.split('-').map(Number);return MN[m-1]+' '+y};

/* ===== šifrování (PBKDF2 + AES-256-CBC, CryptoJS) ===== */
let KEY=null,SALT=null;
function derive(pin,salt){SALT=salt;KEY=CryptoJS.PBKDF2(pin,CryptoJS.enc.Hex.parse(salt),{keySize:8,iterations:20000,hasher:CryptoJS.algo.SHA256})}
function enc(){const iv=CryptoJS.lib.WordArray.random(16);const ct=CryptoJS.AES.encrypt('HBC1'+JSON.stringify(S),KEY,{iv,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7});return{v:1,ts:S.ts,salt:SALT,iv:iv.toString(),ct:ct.toString()}}
function dec(pl,pin){try{derive(pin,pl.salt);const p=CryptoJS.AES.decrypt(pl.ct,KEY,{iv:CryptoJS.enc.Hex.parse(pl.iv),mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7}).toString(CryptoJS.enc.Utf8);return p.startsWith('HBC1')?mig(JSON.parse(p.slice(4))):null}catch(e){return null}}

/* ===== cloud (JSONbin.io) ===== */
const BIN='6ada4facffd5d160538370e0',MK='$2a$10$HNwlTQdlnpAIusjXvv3LG.URQSchoF./4J5It5om4TpB5OJZux.1m',BURL='https://api.jsonbin.io/v3/b/'+BIN;
async function cget(){const r=await fetch(BURL+'/latest',{headers:{'X-Master-Key':MK,'X-Bin-Meta':'false'}});if(!r.ok)throw 0;return r.json()}
async function cput(o){const r=await fetch(BURL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MK},body:JSON.stringify(o)});if(!r.ok)throw 0}
let st='off',tm;
function dirty(){S.ts=Date.now();try{localStorage.setItem('hbc:enc',JSON.stringify(enc()))}catch(e){}st='busy';hdrStatus();clearTimeout(tm);tm=setTimeout(push,800)}
async function push(){try{await cput(JSON.parse(localStorage.getItem('hbc:enc')));st='ok'}catch(e){st='off'}hdrStatus()}
async function refresh(){st='busy';hdrStatus();try{const c=await cget();if(c&&c.ct&&c.ts>S.ts){const n=dec(c,PIN);if(n){S=n;localStorage.setItem('hbc:enc',JSON.stringify(c))}}else if(c.ts<S.ts){await push();return}st='ok'}catch(e){st='off'}render()}
addEventListener('online',()=>S&&push());addEventListener('offline',()=>{st='off';S&&hdrStatus()});

/* ===== data model ===== */
function def(){return{inc:{a:k(45000),b:k(40000)},shared:[{id:uid(),label:'Nájem',amount:k(20000),pa:5000},{id:uid(),label:'Elektřina',amount:k(3000),pa:6000},{id:uid(),label:'Internet',amount:k(600),pa:0}],indiv:[{id:uid(),pid:'a',label:'Netflix',amount:k(379)},{id:uid(),pid:'a',label:'Gym',amount:k(800)},{id:uid(),pid:'a',label:'Mobil',amount:k(299)},{id:uid(),pid:'b',label:'Spotify',amount:k(269)},{id:uid(),pid:'b',label:'Životní pojištění',amount:k(1200)}],sav:{a:k(5000),b:k(5000)},tx:[]}}
function init(){const pd=11,id=dateCyc(iso(new Date()),pd);return{profiles:[{id:'a',name:'Tori'},{id:'b',name:'Fifi'}],payday:pd,hide:false,active:id,budgets:{[id]:def()},last:{payer:'a'},ts:Date.now()}}
/* migrace starších dat: odstranění obálek a převodů, transakce dostanou typ, "společný účet" se rozpůlí */
function mig(s){s.last=s.last||{};delete s.last.env;if(s.last.payer!=='a'&&s.last.payer!=='b')s.last.payer='a';
for(const c in s.budgets){const b=s.budgets[c];delete b.env;delete b.tr;b.tx=(b.tx||[]).flatMap(t=>{t.type=t.type==='inc'?'inc':'exp';delete t.env;if(t.payer==='joint'){const h=Math.floor(t.amount/2);return[{...t,id:uid(),payer:'a',amount:h},{...t,id:uid(),payer:'b',amount:t.amount-h}]}return[t]})}return s}
let S=null,PIN='',U={tab:'plan',ttype:'exp',sf:{mode:'all',from:'',to:''}},TO=null;
const P=['a','b'];
const nm=p=>esc(S.profiles[p==='a'?0:1].name);
const fmt=v=>S.hide?'*** Kč':(v/100).toLocaleString('cs-CZ',{maximumFractionDigits:2})+' Kč';
const sg=v=>(v<0?'−':'+')+' '+fmt(Math.abs(v));
const num=v=>String(v/100).replace('.',',');
const split=(t,pa)=>({a:Math.floor(t*pa/10000),b:t-Math.floor(t*pa/10000)});
/* rozpočty: první "skutečný" cyklus, virtuální cykly bez dat se odvozují z nejbližšího dřívějšího plánu */
const firstId=()=>{const ks=Object.keys(S.budgets).filter(i=>!S.budgets[i].auto).sort();return ks[0]||S.active};
function budgetFor(id){if(S.budgets[id])return S.budgets[id];const ks=Object.keys(S.budgets).sort(),prev=ks.filter(x=>x<id).pop(),src=S.budgets[prev||ks[0]];return src?{inc:src.inc,shared:src.shared,indiv:src.indiv,sav:src.sav,tx:[]}:def()}
const B=()=>{let b=S.budgets[S.active];if(!b){b=JSON.parse(JSON.stringify(budgetFor(S.active)));b.tx=[];b.auto=true;S.budgets[S.active]=b}return b};
const touch=()=>{delete B().auto};
function go(id){const c=S.budgets[S.active];if(c&&c.auto)delete S.budgets[S.active];S.active=id;dirty();render()}
/* výpočty */
function raw(b,p){const sh=sm(b.shared,e=>split(e.amount,e.pa)[p]),ind=sm(b.indiv.filter(e=>e.pid===p),e=>e.amount),tx=b.tx.filter(t=>t.payer===p);return{inc:b.inc[p]||0,sh,ind,fix:sh+ind,sv:b.sav[p]||0,tin:sm(tx.filter(t=>t.type==='inc'),t=>t.amount),tout:sm(tx.filter(t=>t.type!=='inc'),t=>t.amount)}}
function fin(r,c){r.carry=c;r.st=r.inc+c-r.fix-r.sv;r.pk=r.st-r.tout+r.tin;return r}
function carryOf(id,p){const f=firstId();if(id<=f)return 0;let c=0,cur=f,n=0;while(cur<id&&n++<240){c=fin(raw(budgetFor(cur),p),c).pk;cur=shiftC(cur,1)}return c}
const KEYS=['inc','sh','ind','fix','sv','tin','tout','carry','st','pk'];
function R(){const b=B(),a=fin(raw(b,'a'),carryOf(S.active,'a')),c=fin(raw(b,'b'),carryOf(S.active,'b')),h={};KEYS.forEach(x=>h[x]=a[x]+c[x]);return{a,b:c,h}}

/* ===== UI helpers ===== */
const sec=(col,ic,t,sub,body)=>`<section class="glass-card rounded-2xl p-5 sm:p-6 shadow-xl relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-${col}-500"></div><div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl bg-${col}-500/10 border border-${col}-500/20 flex items-center justify-center text-${col}-400"><i class="fa-solid ${ic} text-lg"></i></div><div><h2 class="text-lg font-bold text-white">${t}</h2><p class="text-xs text-slate-400">${sub}</p></div></div>${body}</section>`;
const inp=(f,v,t,col,cls='')=>`<div class="relative ${cls}"><input data-f="${f}" data-t="${t}" value="${t==='text'?esc(v):t==='pct'?v/100:t==='int'?v:num(v)}" ${t==='text'?'maxlength="60"':'inputmode="decimal"'} class="inp input-field w-full bg-slate-950/80 border border-slate-800 text-slate-100 ${t==='text'?'font-medium pr-3':'font-bold pr-10'} rounded-xl pl-3.5 py-2.5 text-sm focus:border-${col}-500 focus:outline-none">${t==='text'?'':`<span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-500">${t==='pct'?'%':t==='int'?'.':'Kč'}</span>`}</div>`;
const del=(kk,i)=>`<button data-act="del" data-k="${kk}" data-i="${i}" class="p-2 text-slate-600 hover:text-rose-400 transition"><i class="fa-solid fa-trash-can text-xs"></i></button>`;
const addB=(kk,p,col,txt)=>`<button data-act="add" data-k="${kk}" data-p="${p||''}" class="mt-3 text-xs font-semibold text-${col}-400 bg-${col}-500/10 hover:bg-${col}-500/20 border border-${col}-500/30 px-3 py-1.5 rounded-xl transition active:scale-95"><i class="fa-solid fa-plus mr-1"></i>${txt}</button>`;
const pcol=p=>p==='a'?'violet':'sky';
const carryTxt=c=>`<span class="font-bold ${c<0?'text-rose-400':'text-violet-300'}">${sg(c)}</span>`;

function planner(b,r){
const inc=sec('emerald','fa-wallet','Měsíční příjmy','Čistá výplata každého z vás a převod z minulého cyklu',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${P.map(p=>`<div><label class="block text-xs font-medium text-slate-300 mb-1.5">${nm(p)}</label>${inp('inc.'+p,b.inc[p]||0,'num','emerald')}<div class="text-[11px] text-slate-400 mt-2 flex justify-between"><span>Převod z minulého cyklu</span>${carryTxt(r[p].carry)}</div></div>`).join('')}</div>`);
const shared=sec('rose','fa-house','Společné fixní výdaje','Nájem, energie, internet. Podíl prvního profilu v %',`<div class="space-y-2">${b.shared.map((e,i)=>`<div class="row flex flex-wrap items-center gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80"><div class="flex-1 min-w-[140px]">${inp(`shared.${i}.label`,e.label,'text','rose')}</div>${inp(`shared.${i}.amount`,e.amount,'num','rose','w-36')}${inp(`shared.${i}.pa`,e.pa,'pct','rose','w-24')}<span class="rest text-xs text-slate-400 w-20">${nm('b')} ${(10000-e.pa)/100} %</span>${del('shared',i)}</div>`).join('')}</div>${addB('shared','','rose','Přidat položku')}`);
const indiv=`<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${P.map(p=>{const rows=b.indiv.map((e,i)=>[e,i]).filter(([e])=>e.pid===p);return`<div class="glass-card rounded-2xl p-5 relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-rose-500"></div><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-white"><i class="fa-solid fa-user text-${pcol(p)}-400 mr-2"></i>${nm(p)}</h3><span class="text-xs font-semibold text-rose-400">${fmt(r[p].ind)}</span></div><div class="space-y-2">${rows.map(([e,i])=>`<div class="flex items-center gap-2"><div class="flex-1 min-w-0">${inp(`indiv.${i}.label`,e.label,'text','rose')}</div>${inp(`indiv.${i}.amount`,e.amount,'num','rose','w-32')}${del('indiv',i)}</div>`).join('')}</div>${addB('indiv',p,'rose','+ Řádek')}</div>`}).join('')}</div>`;
const sav=sec('cyan','fa-piggy-bank','Odklad na úspory','Zaplať nejprve sám sobě (v den výplaty)',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${P.map(p=>`<div><label class="block text-xs font-medium text-slate-300 mb-1.5">${nm(p)}</label>${inp('sav.'+p,b.sav[p]||0,'num','cyan')}</div>`).join('')}</div>`);
return`<div class="space-y-6">${inc}${shared}<div><h2 class="text-sm font-bold uppercase tracking-wider text-rose-400 mb-3 mt-2">Osobní fixní výdaje</h2>${indiv}</div>${sav}</div>`}

/* kompaktní blok kapesného (lepicí karta) */
function blk(r,title){const base=Math.max(1,r.inc+Math.max(0,r.carry)+r.tin),w=x=>Math.min(100,Math.max(0,x/base*100)),al=Math.round((r.fix+r.tout+r.sv)/base*100);
const lg=(c,t,v)=>`<span><i class="fa-solid fa-circle ${c} text-[7px] mr-1"></i>${t} <b class="text-slate-200">${v}</b></span>`;
return`<div><div class="flex justify-between items-baseline"><span class="text-sm font-bold text-slate-200">${title}</span><span class="text-xs text-violet-300">${S.hide?'':al+' % alokováno'}</span></div><div class="text-xs text-slate-400 mt-1">Volné kapesné</div><div class="text-4xl font-black tracking-tight ${r.pk<0?'text-rose-400':'text-white'}">${fmt(r.pk)}</div><div class="w-full h-3.5 bg-slate-950/80 rounded-full overflow-hidden flex p-0.5 border border-slate-800 mt-3"><div class="h-full bg-rose-500 rounded-l-full transition-all duration-300" style="width:${w(r.fix)}%"></div><div class="h-full bg-amber-500 transition-all duration-300" style="width:${w(r.tout)}%"></div><div class="h-full bg-cyan-400 transition-all duration-300" style="width:${w(r.sv)}%"></div><div class="h-full bg-violet-500 rounded-r-full transition-all duration-300" style="width:${w(Math.max(0,r.pk))}%"></div></div><div class="grid grid-cols-2 gap-1.5 mt-2.5 text-[11px] text-slate-400">${lg('text-emerald-500','Příjem',fmt(r.inc))}${lg('text-violet-400','Převod',sg(r.carry))}${lg('text-rose-500','Fixní',fmt(r.fix))}${lg('text-cyan-400','Úspory',fmt(r.sv))}${lg('text-amber-500','Výdaje',fmt(r.tout))}${lg('text-emerald-400','Mimoř. příjmy',fmt(r.tin))}</div></div>`}
function sumHtml(){const r=R(),bad=r.a.pk<0||r.b.pk<0,dot=p=>`<span class="inline-block w-2 h-2 rounded-full bg-${pcol(p)}-400 mr-1.5"></span>${nm(p)}`;
return`<div class="glass-card-accent rounded-3xl p-6 shadow-2xl"><div class="flex items-center justify-between mb-4"><span class="text-xs font-bold uppercase tracking-wider text-violet-300/80">Výsledek plánovače</span><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${bad?'bg-rose-500/20 text-rose-300 border-rose-500/30':'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'} border flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${bad?'bg-rose-500 animate-ping':'bg-emerald-400 animate-pulse'}"></span>${bad?'Mínusový rozpočet':'Vyrovnané'}</span></div>${blk(r.a,dot('a'))}<div class="border-t border-violet-500/20 mt-5 pt-5">${blk(r.b,dot('b'))}</div><div class="border-t border-violet-500/30 mt-5 pt-5">${blk(r.h,'<i class="fa-solid fa-house-user text-emerald-400 mr-1.5"></i>Celá domácnost dohromady')}</div></div>`}
function updateSum(){const d=$('#sumD');if(d)d.innerHTML=sumHtml()}

/* Přehled */
function over(){const r=R();
const line=(l,v,c)=>`<div class="flex justify-between items-center p-2 rounded-xl bg-slate-950/60 border border-slate-800/80"><span class="text-slate-400">${l}</span><span class="font-bold ${c}">${v}</span></div>`;
const det=(x,head,cls)=>{const pc=x.st>0?Math.max(0,Math.min(100,x.pk/x.st*100)):0;return`<div class="${cls} rounded-3xl p-6"><div class="text-sm font-bold text-slate-200 mb-1">${head}</div><div class="text-xs text-slate-400">Zbývající kapesné</div><div class="text-4xl font-black ${x.pk<0?'text-rose-400':'text-white'}">${fmt(x.pk)}</div><div class="h-2.5 bg-slate-950/80 rounded-full overflow-hidden my-3 border border-slate-800"><div class="h-full bg-violet-500 transition-all duration-500" style="width:${pc}%"></div></div><div class="mt-4 space-y-1.5 text-sm">${line('Příjem (výplata)','+ '+fmt(x.inc),'text-emerald-400')}${line('Převod z minulého cyklu',sg(x.carry),x.carry<0?'text-rose-400':'text-violet-300')}${line('Fixní výdaje','− '+fmt(x.fix),'text-rose-400')}${line('Odklad do úspor','− '+fmt(x.sv),'text-cyan-400')}${line('Výdaje z transakcí','− '+fmt(x.tout),'text-amber-400')}${line('Mimořádné příjmy','+ '+fmt(x.tin),'text-emerald-400')}</div></div>`};
const dot=p=>`<span class="inline-block w-2 h-2 rounded-full bg-${pcol(p)}-400 mr-1.5"></span>${nm(p)}`;
return`${det(r.h,'<i class="fa-solid fa-house-user text-emerald-400 mr-1.5"></i>Celá domácnost dohromady','glass-card-accent mb-4')}<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${det(r.a,dot('a'),'glass-card')}${det(r.b,dot('b'),'glass-card')}</div>`}

/* Transakce */
const tcls=(v,on)=>'flex-1 px-3 py-2.5 rounded-xl text-sm font-bold border transition '+(on?(v==='inc'?'bg-emerald-500/20 text-emerald-300 border-emerald-500/50':'bg-rose-500/20 text-rose-300 border-rose-500/50'):'bg-slate-900/60 text-slate-400 border-slate-800');
const scls=v=>'w-full text-white font-bold rounded-xl py-3 transition active:scale-95 '+(v==='inc'?'bg-emerald-600 hover:bg-emerald-500':'bg-rose-600 hover:bg-rose-500');
function paintType(){['inc','exp'].forEach(v=>{const e=$('#tb-'+v);if(e)e.className=tcls(v,U.ttype===v)});const s=$('#tsub');if(s){s.className=scls(U.ttype);s.innerHTML='<i class="fa-solid fa-plus mr-1.5"></i>Uložit '+(U.ttype==='inc'?'příjem':'výdaj')}}
function txs(b){const sel='w-full bg-slate-950/80 border border-slate-800 text-slate-100 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-violet-500';
const l=[...b.tx].sort((x,y)=>y.date.localeCompare(x.date)||y.at-x.at),t=U.ttype;
const form=sec('violet','fa-plus','Nová transakce','Příjem nebo výdaj mimo plán',`<form id="ef" class="space-y-3"><div class="flex gap-2"><button type="button" id="tb-inc" data-act="ttype" data-v="inc" class="${tcls('inc',t==='inc')}">📈 Příjem</button><button type="button" id="tb-exp" data-act="ttype" data-v="exp" class="${tcls('exp',t!=='inc')}">📉 Výdaj</button></div><input id="amt" inputmode="decimal" placeholder="Částka" autocomplete="off" class="inp w-full bg-slate-950/80 border border-slate-800 text-white font-black text-2xl rounded-xl px-3.5 py-3 focus:border-violet-500 focus:outline-none"><input id="ttl" maxlength="60" placeholder="Popis / název (např. Lidl, prodej na Bazoši)" class="${sel}"><select id="epay" class="${sel}">${P.map(p=>`<option value="${p}" ${S.last.payer===p?'selected':''}>${nm(p)}</option>`).join('')}</select><input id="edt" type="date" value="${iso(new Date())}" class="${sel}"><button id="tsub" class="${scls(t)}"><i class="fa-solid fa-plus mr-1.5"></i>Uložit ${t==='inc'?'příjem':'výdaj'}</button></form>`);
const list=sec('cyan','fa-receipt','Transakce v cyklu','Poslední nahoře',`<div class="space-y-2">${l.map(x=>{const inc=x.type==='inc';return`<div class="flex items-center justify-between gap-2 p-2.5 bg-slate-950/60 border border-slate-800/80 rounded-xl text-sm"><div class="min-w-0"><div class="font-semibold text-slate-200 truncate"><i class="fa-solid ${inc?'fa-arrow-trend-up text-emerald-400':'fa-arrow-trend-down text-rose-400'} mr-1.5 text-xs"></i>${esc(x.title)}</div><div class="text-[11px] text-slate-500"><span class="inline-block w-2 h-2 rounded-full mr-1 ${x.payer==='a'?'bg-violet-400':'bg-sky-400'}"></span>${nm(x.payer)} · ${x.date}</div></div><div class="shrink-0 font-bold ${inc?'text-emerald-400':'text-rose-400'}">${inc?'+':'−'} ${fmt(x.amount)}<button data-act="deltx" data-id="${x.id}" class="ml-2 text-slate-600 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button></div></div>`}).join('')||'<div class="text-xs text-slate-500">Zatím žádné transakce.</div>'}</div>`);
return`<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">${form}${list}</div>`}

/* Statistiky */
const idsBetween=(a,z)=>{const r=[];let c=a,n=0;while(c<=z&&n++<240){r.push(c);c=shiftC(c,1)}return r};
function statRange(){const f=firstId();let zmax=dateCyc(iso(new Date()),S.payday);if(zmax<f)zmax=f;let a=f,z=zmax;const m=U.sf.mode;
if(m==='year')a=zmax.slice(0,4)+'-01';else if(m==='3m')a=shiftC(zmax,-2);else if(m==='custom'){a=U.sf.from||f;z=U.sf.to||zmax;if(a>z){const t=a;a=z;z=t}}
if(a<f)a=f;if(z>zmax)z=zmax;if(a>z)a=z;return{a,z,f,zmax}}
function stats(){const g=statRange(),L=idsBetween(g.a,g.z).map(budgetFor),T={a:{},b:{}};
KEYS.slice(0,7).forEach(x=>{P.forEach(p=>T[p][x]=0)});L.forEach(b=>P.forEach(p=>{const r=raw(b,p);KEYS.slice(0,7).forEach(x=>T[p][x]+=r[x])}));
const H={};KEYS.slice(0,7).forEach(x=>H[x]=T.a[x]+T.b[x]);
const M=x=>{const income=x.inc+x.tin,exp=x.fix+x.tout;return{inc:x.inc,tin:x.tin,income,fix:x.fix,tout:x.tout,exp,sv:x.sv,bal:income-exp-x.sv}};
const m={h:M(H),a:M(T.a),b:M(T.b)},h=m.h;
const btn=(v,t)=>`<button data-act="sf" data-v="${v}" class="px-4 py-2 rounded-xl text-sm font-semibold border transition ${U.sf.mode===v?'bg-violet-500/20 text-violet-300 border-violet-500/40':'bg-slate-900/60 text-slate-400 border-slate-800 hover:text-white'}">${t}</button>`;
const opts=sel=>idsBetween(g.f,g.zmax).map(i=>`<option value="${i}" ${i===sel?'selected':''}>${cyLabel(i)}</option>`).join('');
const selc='bg-slate-950 text-slate-100 font-semibold text-sm rounded-lg px-2 py-1.5 border border-slate-700 focus:outline-none focus:border-violet-500';
const custom=U.sf.mode==='custom'?`<div class="flex flex-wrap items-center gap-2 mt-3 text-sm text-slate-400">Od <select data-sf="from" class="${selc}">${opts(g.a)}</select> do <select data-sf="to" class="${selc}">${opts(g.z)}</select></div>`:'';
const filter=`<div class="glass-card rounded-2xl p-4"><div class="flex flex-wrap gap-2">${btn('all','Od počátku')}${btn('year','Tento rok')}${btn('3m','Poslední 3 měsíce')}${btn('custom','Vlastní výběr')}</div>${custom}<div class="text-[11px] text-slate-500 mt-3">${cyLabel(g.a)} – ${cyLabel(g.z)} · ${L.length} ${L.length===1?'cyklus':L.length<5?'cykly':'cyklů'}</div></div>`;
const card=(col,ic,t,v,sub,neg)=>`<div class="glass-card rounded-2xl p-5 relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-${col}-500"></div><div class="text-xs text-slate-400 flex items-center gap-2"><i class="fa-solid ${ic} text-${col}-400"></i>${t}</div><div class="text-2xl font-black mt-1 ${neg?'text-rose-400':'text-white'}">${v}</div><div class="text-[11px] text-slate-500 mt-0.5">${sub}</div></div>`;
const rate=h.income>0?Math.round(h.sv/h.income*100):0;
const cards=`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">${card('emerald','fa-wallet','Celkové příjmy',fmt(h.income),'mzdy + mimořádné příjmy')}${card('rose','fa-arrow-trend-down','Celkové výdaje',fmt(h.exp),'fixní + transakce')}${card('cyan','fa-piggy-bank','Míra úspor',fmt(h.sv),S.hide?'odložené úspory':rate+' % příjmů')}${card('violet','fa-scale-balanced','Čistá bilance',fmt(h.bal),'příjmy − výdaje − úspory',h.bal<0)}</div>`;
const rows=[['Mzdy','inc','text-emerald-400'],['Mimořádné příjmy','tin','text-emerald-400'],['Celkové příjmy','income','text-emerald-400 font-bold'],['Fixní výdaje','fix','text-rose-400'],['Výdaje z transakcí','tout','text-amber-400'],['Celkové výdaje','exp','text-rose-400 font-bold'],['Úspory','sv','text-cyan-400'],['Čistá bilance','bal','text-violet-300 font-bold']];
const table=sec('violet','fa-table','Rozpad dat','Celá domácnost a každý zvlášť',`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-slate-400 text-right"><th class="text-left py-2 font-medium"></th><th class="py-2 font-semibold">Domácnost</th><th class="py-2 font-semibold text-violet-300">${nm('a')}</th><th class="py-2 font-semibold text-sky-300">${nm('b')}</th></tr></thead><tbody>${rows.map(([l,kk,c])=>`<tr class="border-t border-slate-800/80 text-right"><td class="text-left py-2 text-slate-300">${l}</td>${['h','a','b'].map(s=>`<td class="py-2 tabular-nums ${c} ${kk==='bal'&&m[s][kk]<0?'!text-rose-400':''}">${fmt(m[s][kk])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
const share=(t,va,vb)=>{const tot=va+vb,pa=tot>0?va/tot*100:50;return`<div><div class="text-xs font-semibold text-slate-300 mb-2">${t}</div><div class="w-full h-3.5 bg-slate-950/80 rounded-full overflow-hidden flex p-0.5 border border-slate-800"><div class="h-full bg-violet-500 rounded-l-full transition-all duration-300" style="width:${pa}%"></div><div class="h-full bg-sky-500 rounded-r-full transition-all duration-300" style="width:${100-pa}%"></div></div><div class="flex justify-between text-[11px] mt-2 text-slate-400"><span><i class="fa-solid fa-circle text-violet-500 text-[7px] mr-1"></i>${nm('a')} <b class="text-slate-200">${fmt(va)}</b>${S.hide||!tot?'':' · '+Math.round(pa)+' %'}</span><span><i class="fa-solid fa-circle text-sky-500 text-[7px] mr-1"></i>${nm('b')} <b class="text-slate-200">${fmt(vb)}</b>${S.hide||!tot?'':' · '+Math.round(100-pa)+' %'}</span></div></div>`};
const cmp=sec('sky','fa-people-arrows','Kdo kolik přinesl a utratil','Podíl na příjmech a výdajích domácnosti',`<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${share('Přinesl do domácnosti (příjmy)',m.a.income,m.b.income)}${share('Utratil (fixní výdaje + transakce)',m.a.exp,m.b.exp)}</div>`);
return`<div class="space-y-6">${filter}${cards}${table}${cmp}</div>`}

function sett(){return sec('violet','fa-gear','Nastavení','Jména se okamžitě propíšou všude',`<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${S.profiles.map((p,i)=>`<div><label class="block text-xs text-slate-300 mb-1.5">Profil ${i+1}</label>${inp(`profiles.${i}.name`,p.name,'text','violet')}</div>`).join('')}<div><label class="block text-xs text-slate-300 mb-1.5">Den výplaty (1–31)</label>${inp('payday',S.payday,'int','violet')}</div></div><div class="flex flex-wrap gap-2 mt-5"><button data-act="lockNow" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold"><i class="fa-solid fa-lock mr-1.5"></i>Zamknout</button><button data-act="reset" class="px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-semibold">Smazat všechna data</button></div><p class="text-xs text-slate-500 mt-4">Data jsou šifrovaná PINem v tomto zařízení i na JSONbin.io.</p>`)}

const STL={ok:['🟢','Synced','text-emerald-400'],busy:['🟡','Ukládám','text-amber-300'],off:['🔴','Offline','text-rose-400']};
function hdrStatus(){const e=$('#stat');if(!e)return;const[i,t,c]=STL[st];e.className='text-xs font-semibold flex items-center gap-1.5 '+c;e.innerHTML=`${i} ${t}`}
function cyOpts(){const set=new Set(Object.keys(S.budgets)),base=dateCyc(iso(new Date()),S.payday);for(let i=-12;i<=12;i++)set.add(shiftC(base,i));set.add(S.active);return [...set].sort().map(id=>`<option value="${id}" ${id===S.active?'selected':''}>${cyLabel(id)}</option>`).join('')}
function render(){if(!S)return;const b=B(),c=cyc(S.active,S.payday),tabs=[['plan','Plánovač','fa-sliders'],['over','Přehled','fa-chart-pie'],['tx','Transakce','fa-receipt'],['stat','Statistiky','fa-chart-column'],['set','Nastavení','fa-gear']];
const A=$('#app');A.className=S.hide?'hide':'';
A.innerHTML=`<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8 pb-16"><header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-800/80"><div><div class="flex flex-wrap items-center gap-2 mb-1"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-violet-500/10 text-violet-400 border border-violet-500/20"><i class="fa-solid fa-user-group mr-1"></i>${nm('a')} &amp; ${nm('b')}</span><span class="px-2.5 py-0.5 rounded-full bg-slate-900/80 border border-slate-800"><span id="stat"></span></span><button data-act="sync" title="Obnovit z cloudu" class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 border border-slate-800 hover:bg-slate-800">🔄</button><button data-act="hide" title="Skrýt částky" class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 border border-slate-800 hover:bg-slate-800"><i class="fa-solid ${S.hide?'fa-eye-slash':'fa-eye'}"></i></button><button data-act="lockNow" title="Zamknout" class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 border border-slate-800 hover:bg-slate-800"><i class="fa-solid fa-lock"></i></button></div><h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Domácí rozpočet</h1></div><div class="flex items-center bg-slate-900/90 border border-slate-800 rounded-2xl p-1.5 shadow-lg self-start md:self-auto"><button data-act="cy" data-n="-1" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"><i class="fa-solid fa-chevron-left text-xs"></i></button><div class="px-2 py-0.5 text-center min-w-[170px]"><select data-cysel aria-label="Měsíční cyklus" class="bg-slate-950 text-slate-100 font-bold text-sm rounded-lg px-2 py-1 border border-slate-700 focus:outline-none focus:border-violet-500 cursor-pointer max-w-[190px]">${cyOpts()}</select><span class="block text-[10px] text-slate-500 mt-0.5">${fd(c.s)}– ${fd(c.e)}${c.e.getFullYear()}</span></div><button data-act="cy" data-n="1" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"><i class="fa-solid fa-chevron-right text-xs"></i></button></div></header><div class="flex gap-2 overflow-x-auto mb-6">${tabs.map(([i,l,ic])=>`<button data-act="tab" data-v="${i}" class="shrink-0 px-4 py-2 rounded-xl text-sm font-semibold border transition ${U.tab===i?'bg-violet-500/20 text-violet-300 border-violet-500/40':'bg-slate-900/60 text-slate-400 border-slate-800 hover:text-white'}"><i class="fa-solid ${ic} mr-1.5"></i>${l}</button>`).join('')}</div>${U.tab==='plan'?`<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start"><div class="lg:col-span-7 order-2 lg:order-1">${planner(b,R())}</div><div id="sumD" class="lg:col-span-5 lg:sticky lg:top-8 order-1 lg:order-2 sticky top-2 z-20 lg:z-auto">${sumHtml()}</div></div>`:U.tab==='over'?over():U.tab==='tx'?txs(b):U.tab==='stat'?stats():sett()}</div>${TO?`<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-100 text-slate-900 px-4 py-2.5 rounded-xl text-sm font-semibold z-50">${esc(TO)}</div>`:''}`;hdrStatus()}
function say(m){TO=m;render();clearTimeout(say.t);say.t=setTimeout(()=>{TO=null;render()},3000)}

/* ===== události ===== */
function setPath(path,val){const p=path.split('.');let o=(p[0]==='profiles'||p[0]==='payday')?S:B();for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.f||!S)return;const t=el.dataset.t;let v=el.value;if(t==='num')v=Math.round(Math.max(0,parse(v)||0)*100);else if(t==='pct'){v=Math.round(Math.max(0,Math.min(100,parse(v)||0))*100);const r=el.closest('.row');if(r)r.querySelector('.rest').textContent=nm('b').replace(/&amp;/g,'&')+' '+(10000-v)/100+' %'}else if(t==='int')v=Math.max(1,Math.min(31,parseInt(v)||11));else v=v.slice(0,60);if(!el.dataset.f.startsWith('profiles')&&el.dataset.f!=='payday')touch();setPath(el.dataset.f,v);updateSum();dirty()});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset||{};if(!S)return;
if(d.cysel!==undefined){go(el.value);return}
if(d.sf){U.sf[d.sf]=el.value;render();return}
if(d.f&&(d.f.startsWith('profiles')||d.f==='payday'))render()});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id!=='ef'||!S)return;const b=B();
const a=parse($('#amt').value),d=$('#edt').value,title=$('#ttl').value.trim();
if(!(a>0)||a>1e7)return say('Zadej platnou částku');
if(!title)return say('Zadej popis transakce');
if(!d||dateCyc(d,S.payday)!==S.active)return say('Datum je mimo zobrazený cyklus');
const pay=$('#epay').value==='b'?'b':'a',t={id:uid(),type:U.ttype==='inc'?'inc':'exp',amount:Math.round(a*100),title:title.slice(0,60),payer:pay,date:d,at:Date.now()};
touch();b.tx.push(t);S.last={payer:pay};dirty();say((t.type==='inc'?'Příjem uložen: ':'Výdaj uložen: ')+t.title)});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!S)return;const a=el.dataset.act,d=el.dataset,b=B();
if(a==='tab'){U.tab=d.v;render()}
else if(a==='cy')go(shiftC(S.active,+d.n));
else if(a==='hide'){S.hide=!S.hide;dirty();render()}
else if(a==='sync')refresh();
else if(a==='lockNow')lockApp();
else if(a==='ttype'){U.ttype=d.v;paintType()}
else if(a==='sf'){U.sf.mode=d.v;render()}
else if(a==='add'){touch();if(d.k==='shared')b.shared.push({id:uid(),label:'Nová položka',amount:0,pa:5000});if(d.k==='indiv')b.indiv.push({id:uid(),pid:d.p,label:'Nová položka',amount:0});dirty();render()}
else if(a==='del'){touch();b[d.k].splice(+d.i,1);dirty();render()}
else if(a==='deltx'){touch();b.tx=b.tx.filter(x=>x.id!==d.id);dirty();render()}
else if(a==='reset'){if(confirm('Opravdu smazat všechna data (i v cloudu)?')){S=init();dirty();render()}}});

/* ===== zámek / PIN ===== */
let mode='unlock',pin='',first=null,loc=null,cl=null,busy=false;
function lockHtml(msg,err){const dots=[0,1,2,3].map(i=>`<span class="w-3.5 h-3.5 rounded-full border ${i<pin.length?'bg-violet-400 border-violet-400':'border-slate-600'}"></span>`).join('');
const title=mode==='setup'?(first?'Potvrď PIN':'Vytvoř 4místný PIN'):mode==='err'?'Nelze načíst cloud':'Zadej PIN';
const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(x=>x===''?'<span></span>':`<button data-pk="${x}" class="h-14 rounded-2xl bg-slate-900/80 border border-slate-800 hover:bg-slate-800 active:scale-95 transition text-xl font-bold">${x}</button>`).join('');
return`<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#090d16]/80 backdrop-blur-md"><div id="lbox" class="glass-card-accent rounded-3xl p-7 w-full max-w-xs text-center ${err?'shake':''}"><div class="w-16 h-16 mx-auto mb-3 rounded-2xl overflow-hidden"><img src="${ICON_URI}" alt="" class="w-full h-full"></div><h2 class="text-xl font-extrabold text-white">${title}</h2><p class="text-xs ${err?'text-rose-400':'text-slate-400'} mt-1 min-h-[16px]">${msg||'Domácí rozpočet je zašifrovaný'}</p>${mode==='err'?'<button data-pk="retry" class="mt-5 w-full bg-violet-600 text-white font-bold rounded-xl py-3">Zkusit znovu</button>':`<div class="flex justify-center gap-3 my-5">${dots}</div><div class="grid grid-cols-3 gap-2.5">${keys}</div>`}</div></div>`}
function showLock(msg,err){pin='';$('#lock').innerHTML=lockHtml(msg,err)}
async function boot(){loc=localStorage.getItem('hbc:enc');if(loc){mode='unlock';return showLock()}$('#lock').innerHTML=lockHtml('Načítám cloud…');try{cl=await cget();mode=cl&&cl.ct?'unlock':'setup'}catch(e){mode='err';st='off';return showLock('Jsi offline a v zařízení nejsou žádná data.')}showLock()}
function pk(x){if(busy)return;if(x==='retry')return boot();if(x==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=x;$('#lock').innerHTML=lockHtml();if(pin.length===4){busy=true;setTimeout(submitPin,60)}}
async function submitPin(){const p=pin;try{
if(mode==='setup'){if(!first){first=p;busy=false;return showLock('Zadej PIN ještě jednou')}if(p!==first){first=null;busy=false;return showLock('PINy se neshodují',true)}derive(p,CryptoJS.lib.WordArray.random(16).toString());PIN=p;S=init();first=null;return open()}
let L=null,C=null;if(loc)L=dec(JSON.parse(loc),p);try{cl=cl||await cget();if(cl&&cl.ct)C=dec(cl,p);st='ok'}catch(e){st='off'}
if(!L&&!C){busy=false;return showLock('Špatný PIN',true)}
S=(L&&C)?(C.ts>L.ts?C:L):(L||C);PIN=p;derive(p,(S===C?cl:JSON.parse(loc)).salt);
if(L&&(!C||L.ts>C.ts)&&st==='ok'){const pl=enc();localStorage.setItem('hbc:enc',JSON.stringify(pl));push()}else if(C&&(!L||C.ts>=L.ts))localStorage.setItem('hbc:enc',JSON.stringify(cl));
open()}catch(e){busy=false;showLock('Chyba, zkus znovu',true)}}
function open(){busy=false;$('#lock').innerHTML='';$('#app').classList.remove('hidden');dirty();render()}
function lockApp(){S=null;KEY=null;PIN='';cl=null;loc=localStorage.getItem('hbc:enc');$('#app').innerHTML='';mode='unlock';showLock()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pk]');if(b)pk(b.dataset.pk)});
document.addEventListener('keydown',e=>{if(!S&&$('#lbox')){if(/^\d$/.test(e.key))pk(e.key);else if(e.key==='Backspace')pk('⌫')}});
